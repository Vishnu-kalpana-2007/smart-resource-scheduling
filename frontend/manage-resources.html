<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Resources - SmartSchedule</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <i class="fa-regular fa-calendar-days"></i>

        <span>
            Smart<span>Schedule</span>
        </span>
    </div>

    <nav>

        <a href="admin-dashboard.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="manage-resources.html" class="nav-btn">
            <i class="fa-solid fa-building"></i>
            Resources
        </a>

        <a href="view-bookings.html">
            <i class="fa-solid fa-calendar-check"></i>
            Bookings
        </a>

        <a href="users.html">
            <i class="fa-solid fa-users"></i>
            Users
        </a>

        <a href="index.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </nav>

</header>


<section class="dashboard-page">

    <div class="dashboard-header">

        <p class="tagline">RESOURCE MANAGEMENT</p>

        <h1>
            Manage <span>Resources</span>
        </h1>

        <p>
            View and manage the resources available for booking.
        </p>

    </div>


    <div class="resource-admin-container">

        <div class="resource-list-card">

            <h2>
                <i class="fa-solid fa-building"></i>
                Available Resources
            </h2>

            <div id="adminResourceList">
                Loading resources...
            </div>

        </div>


        <div class="resource-add-card">

            <h2>
                <i class="fa-solid fa-plus"></i>
                Add Resource
            </h2>

            <form id="resourceForm">

                <label>Resource Name</label>

                <input
                    type="text"
                    id="resourceName"
                    placeholder="e.g. Seminar Hall"
                    required>


                <label>Location</label>

                <input
                    type="text"
                    id="resourceLocation"
                    placeholder="e.g. Block C"
                    required>


                <label>Capacity</label>

                <input
                    type="number"
                    id="resourceCapacity"
                    min="1"
                    placeholder="e.g. 40"
                    required>


                <label>Type</label>

                <input
                    type="text"
                    id="resourceType"
                    placeholder="e.g. Meeting Room"
                    required>


                <button type="submit" class="auth-btn">
                    <i class="fa-solid fa-plus"></i>
                    Add Resource
                </button>

            </form>

        </div>

    </div>

</section>


<footer>
    © 2026 SmartSchedule | Smarter Scheduling. A More Organized You.
</footer>


<script src="../js/app.js"></script>

</body>
</html>
